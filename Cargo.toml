[package]
name = "visioncache"
version = "0.2.1"
edition = "2024"
description = "Window-scoped desktop observation and input over MCP"

[[bin]]
name = "visioncache-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
fast_image_resize = "6.2"
png = "0.18"
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSError", "NSObject", "NSProcessInfo", "NSString"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "libc", "SCShareableContent", "SCScreenshotManager", "SCStream", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "HIServices", "AXUIElement", "AXError", "AXValue", "libc", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGWindow",
    "CGAffineTransform", "CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation", "libc",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std", "objc2", "CFArray", "CFString", "CFCGTypes", "CFRunLoop",
] }

[profile.release]
lto = "thin"
